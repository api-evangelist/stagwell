note: >-
  Stagwell (NASDAQ: STGW) is a holding company and publishes no pricing for a
  developer product at the parent level. The only published, itemized API pricing
  on a Stagwell-owned property is IMAI / InfluencerMarketing.ai (a Stagwell
  company since the July 2024 LEADERS acquisition, part of the PRophet suite in
  the Stagwell Marketing Cloud). Two API products are priced publicly, plus five
  platform SaaS tiers. All API plans are annual and contract-based — the provider
  states explicitly that it does not offer monthly or pay-as-you-go API plans,
  and payment is by bank transfer only.
