apis:
  - name: IMAI Discovery API
    description: >-
      Credit-metered REST API over IMAI's creator database of 380M+ influencers
      across Instagram, TikTok and YouTube. Documented capabilities are keyword
      and filter search, AI search, influencer reports, audience reports,
      performance metrics, brand collaborations and collaboration summaries, and
      email lookup. Sold on an annual contract starting at $15,000/year with 3,000
      credits per month; each endpoint consumes a published credit rate. Access is
      by API key in the Authorization header. Owned by Stagwell (NASDAQ: STGW)
      since the July 2024 LEADERS acquisition and operated inside the PRophet
      suite of the Stagwell Marketing Cloud, which is why it lives on its own
      domain rather than a stagwellglobal.com host.
    humanURL: https://influencermarketing.ai/api/
    baseURL: https://imai.co/api
