description: >-
  Stagwell (NASDAQ: STGW) is a digital-first global marketing services and
  technology company and a Fortune 1000 firm, operating a network of creative,
  media, communications and research agencies alongside the Stagwell Marketing
  Cloud (now branded The Marketing Cloud), a suite of proprietary SaaS and DaaS
  marketing-technology products built by its in-house engineering teams. Stagwell
  does not publish a unified public developer portal at the holding-company
  level and ships no OpenAPI, AsyncAPI or agent card of its own; developer access
  is exposed product by product. The most substantial public developer surface in
  the group belongs to IMAI / InfluencerMarketing.ai, acquired with LEADERS in
  July 2024 and folded into the PRophet Comms Tech suite, which publishes a
  credit-metered REST creator-data API (Discovery and Raw), an llms.txt, and an
  OAuth-protected Model Context Protocol endpoint on its own host.
