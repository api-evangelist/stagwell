  - name: IMAI Raw API
    description: >-
      Per-request REST API returning live, unfiltered data read directly from
      influencer profiles — campaign post capture, mention monitoring, and brand
      and creator collaboration timelines in real time. Metered separately from
      Discovery credits and sold on an annual contract starting at $10,000/year
      with 40,000 requests per month. Same host, API key and documentation as the
      Discovery API; a Stagwell (STGW) product via IMAI / InfluencerMarketing.ai.
    humanURL: https://influencermarketing.ai/api/
    baseURL: https://imai.co/api
