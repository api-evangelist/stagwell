        url: authentication/stagwell-authentication.yml
  - name: IMAI MCP Server
    description: >-
      OAuth-protected Model Context Protocol endpoint served on the IMAI /
      InfluencerMarketing.ai host by the Novamira WordPress plugin, advertised
      through RFC 9728 protected-resource metadata and an RFC 8414
      authorization-server document. It exposes the WordPress site and content
      surface to agents — abilities, chat, and REST skills — and is not the IMAI
      Discovery/Raw creator-data product API. tools/list is gated: an anonymous
      JSON-RPC call returns HTTP 401 rest_oauth_required.
    humanURL: https://influencermarketing.ai/
    baseURL: https://influencermarketing.ai/wp-json/mcp/novamira-oauth
