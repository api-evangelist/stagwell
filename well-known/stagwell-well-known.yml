  fronts the site's Model Context Protocol server; the protected resource they
  point at is https://influencermarketing.ai/wp-json/mcp/novamira-oauth. No
  security.txt is served on any host, so no SecurityTxt pointer is emitted. The
  Stagwell corporate host and themarketingcloud.com return 404/"Invalid
  .well-known request" on every path probed.
